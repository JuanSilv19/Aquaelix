insmod serial
serial --speed=115200
terminal_input serial console
terminal_output serial console
set timeout=5
set default=0

menuentry "Aquaelix" {
    linux /boot/bzImage console=ttyS0
    initrd /boot/initramfs.cpio.gz
}

menuentry "Aquaelix (pantalla)" {
    linux /boot/bzImage console=tty0
    initrd /boot/initramfs.cpio.gz
}
